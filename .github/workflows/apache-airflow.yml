name: Build and Push Apache Airflow Image

on:
  push:
    branches: [main]
    paths:
      - "apache-airflow/**"
      - ".github/workflows/apache-airflow.yml"
  workflow_dispatch:

# Only one build at a time; cancel any in-flight run when a new push arrives.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: apache-airflow

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Required for cross-platform builds (linux/arm64 on amd64 runners).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./apache-airflow
          platforms: linux/amd64,linux/arm64
          push: true
          # Only ever push the "latest" tag — no versioned history.
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # After every push the previous "latest" loses its tag and becomes untagged.
  # This job purges those untagged layers, keeping only the current image.
  cleanup:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      packages: write

    steps:
      - name: Delete untagged (old) image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ env.IMAGE_NAME }}
          package-type: container
          min-versions-to-keep: 0
          delete-only-untagged-versions: true
